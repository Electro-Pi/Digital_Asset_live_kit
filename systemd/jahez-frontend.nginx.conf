server {
    listen 6702 ssl http2;
    listen [::]:6702 ssl http2;
    server_name demo.testdevelopment.top www.demo.testdevelopment.top;

    ssl_certificate     /etc/letsencrypt/live/demo.testdevelopment.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.testdevelopment.top/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 10M;

    access_log /var/log/nginx/jahez-frontend.access.log;
    error_log  /var/log/nginx/jahez-frontend.error.log;

    location / {
        proxy_pass http://127.0.0.1:6701;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }
}
