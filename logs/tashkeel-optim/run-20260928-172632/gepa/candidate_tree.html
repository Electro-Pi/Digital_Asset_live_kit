628\u064e\u0629\u00bb\u060c \u00ab\u0633\u064e\u0644\u064e\u0637\u064e\u0629\u00bb\u060c \u00ab\u0633\u0650\u062a\u064e\u0651\u0629\u00bb\u060c \u00ab\u0633\u064f\u0639\u0652\u0631\u064e\u0629\u00bb\u060c \u00ab\u0645\u0650\u0626\u064e\u0629\u00bb.\n3. \u062a\u0634\u0643\u064a\u0644 \u0627\u0644\u062d\u0631\u0648\u0641 \u0627\u0644\u062f\u0627\u062e\u0644\u064a\u0629 \u0643\u0627\u0645\u0644\u0627\u064b \u0628\u0644\u0627 \u0625\u0647\u0645\u0627\u0644:\n   - \u0644\u0627 \u062a\u062a\u0631\u0643\u064a \u0623\u064a \u062d\u0631\u0641 \u062f\u0627\u062e\u0644 \u0627\u0644\u0643\u0644\u0645\u0629 \u0628\u0644\u0627 \u062d\u0631\u0643\u0629 \u0623\u0648 \u0633\u0643\u0648\u0646: \u00ab\u0645\u0650\u0646\u0652\u0647\u064e\u0627\u00bb (\u0633\u0643\u0648\u0646 \u0639\u0644\u0649 \u0627\u0644\u0646\u0648\u0646)\u060c \u00ab\u0628\u0650\u0645\u0650\u0626\u064e\u062a\u064e\u064a\u0652\u0646\u00bb (\u062a\u0634\u0643\u064a\u0644 \u0643\u0644 \u062d\u0631\u0641 \u062f\u0627\u062e\u0644\u064a).\n4. \u062d\u0631\u0648\u0641 \u0627\u0644\u062c\u0631 \u0648\u0627\u0644\u0639\u0637\u0641 \u0627\u0644\u0645\u062a\u0635\u0644\u0629:\n   - \u062a\u062a\u0635\u0644 \u0628\u0627\u0644\u0643\u0644\u0645\u0629 \u0645\u0628\u0627\u0634\u0631\u0629 \u0628\u0644\u0627 \u0645\u0633\u0627\u0641\u0629 \u0648\u0628\u0644\u0627 \u0645\u064e\u062f\u0651\u0629\u060c \u0648\u0625\u064a\u0627\u0643\u0650 \u0643\u062a\u0627\u0628\u062a\u0647\u0627 \u0645\u0646\u0641\u0635\u0644\u0629.\n   - \u0648\u0627\u0648 \u0627\u0644\u0639\u0637\u0641 \u0645\u0641\u062a\u0648\u062d\u0629 \u062f\u0627\u0626\u0645\u0627\u064b \u00ab\u0648\u064e\u0640\u00bb \u0648\u062a\u062a\u0635\u0644 \u0645\u0628\u0627\u0634\u0631\u0629: \u00ab\u0648\u064e\u0643\u064e\u0645\u00bb\u060c \u00ab\u0648\u064e\u0647\u064e\u0630\u0650\u064a\u00bb\u060c \u00ab\u0648\u064e\u0627\u062d\u0650\u062f\u00bb\u060c \u00ab\u0648\u064e\u0644\u064e\u0651\u0627\u00bb\u060c \u00ab\u0648\u064e\u0633\u0650\u062a\u0650\u0651\u064a\u0646\u00bb.\n   - \u0628\u0627\u0621 \u0627\u0644\u062c\u0631 \u0645\u0643\u0633\u0648\u0631\u0629 \u062f\u0627\u0626\u0645\u0627\u064b \u00ab\u0628\u0650\u0640\u00bb\u060c \u0648\u0625\u064a\u0627\u0643\u0650 \u0643\u062a\u0627\u0628\u062a\u0647\u0627 \u0645\u0646\u0641\u0635\u0644\u0629 \u0623\u0648 \u0628\u0645\u062f\u0629 \u0645\u062b\u0644 \u00ab\u0628\u0640\u00bb: \u00ab\u0628\u0650\u062b\u064e\u0645\u064e\u0627\u0646\u0650\u064a\u064e\u0629\u00bb\u060c \u00ab\u0628\u0650\u062e\u064e\u0645\u0652\u0633\u0650\u064a\u0646\u00bb\u060c \u00ab\u0628\u0650\u0645\u0650\u0626\u064e\u062a\u064e\u064a\u0652\u0646\u00bb\u060c \u00ab\u0628\u0650\u0631\u0650\u064a\u064e\u0627\u0644\u00bb.\n5. \u0627\u0644\u062d\u0631\u0643\u0627\u062a \u0639\u0644\u0649 \u0646\u0637\u0642 \u0627\u0644\u0633\u0639\u0648\u062f\u064a \u0641\u064a \u0643\u0644\u0627\u0645\u0647 \u0627\u0644\u064a\u0648\u0645\u064a (\u0648\u0644\u064a\u0633 \u0627\u0644\u0641\u0635\u062d\u0649):\n   - \u0623\u0641\u0639\u0627\u0644 \u0627\u0644\u0645\u0636\u0627\u0631\u0639 \u062a\u0628\u062f\u0623 \u0628\u0643\u0633\u0631\u0629: \u00ab\u064a\u0650\u0646\u064e\u0627\u0633\u0652\u0628\u064e\u0643\u00bb\u060c \u00ab\u062a\u0650\u062d\u0650\u0628\u00bb\u060c \u00ab\u062a\u064e\u0628\u0650\u064a\u00bb\u060c \u00ab\u062a\u0650\u062d\u0652\u062a\u064e\u0627\u062c\u064f\u0648\u0646\u00bb\u060c \u00ab"}}];
const DOT = `digraph G {
    rankdir=TB;
    node [style=filled, shape=circle, fontsize=14, width=0.6, height=0.6];
    0 [label="0\\n(0.96)", fillcolor=orange, tooltip=" "];
    1 [label="1\\n(0.98)", fillcolor=cyan, tooltip=" "];
    2 [label="2\\n(0.95)", fillcolor=lightgray, tooltip=" "];
    3 [label="3\\n(0.94)", fillcolor=orange, tooltip=" "];
    4 [label="4\\n(0.95)", fillcolor=orange, tooltip=" "];
    5 [label="5\\n(0.97)", fillcolor=orange, tooltip=" "];
    0 -> 1;
    0 -> 2;
    0 -> 3;
    3 -> 4;
    3 -> 5;
}`;

const nodeMap = {};
NODES.forEach(n => { nodeMap[n.idx] = n; });

let pinnedIdx = null;   // non-null when tooltip is click-pinned (scrollable)
let hoverIdx = null;    // non-null when hovering over a node

function renderTooltip(idx) {
  const n = nodeMap[idx];
  if (!n) return "";
  let roleBadge = "";
  if (n.role === "Best") roleBadge = '<span class="role-badge role-best">BEST</span>';
  else if (n.role === "Pareto Front") roleBadge = '<span class="role-badge role-pareto">PARETO</span>';
  else if (n.role === "Seed") roleBadge = '<span class="role-badge role-seed">SEED</span>';

  let comps = "";
  for (const [name, text] of Object.entries(n.components)) {
    const escaped = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    comps += '<div class="tt-comp-name">' + name + '</div><div class="tt-comp-text">' + escaped + '</div>';
  }

  return '<div class="tt-header">Candidate ' + n.idx + roleBadge + '</div>' +
    '<div class="tt-meta">Score: <strong>' + n.score + '</strong>&nbsp;&nbsp;|&nbsp;&nbsp;Parent(s): ' + n.parents +
    '</div><div class="tt-hint">' + (pinnedIdx === idx ? 'Click node again to dismiss' : 'Click to pin &amp; scroll') + '</div>' +
    comps;
}

function positionTooltip(x, y) {
  const tt = document.getElementById("tooltip");
  let tx = x + 16, ty = y + 16;
  const r = tt.getBoundingClientRect();
  if (tx + r.width > window.innerWidth - 8) tx = x - r.width - 16;
  if (ty + r.height > window.innerHeight - 8) ty = y - r.height - 16;
  if (tx < 8) tx = 8;
  if (ty < 8) ty = 8;
  tt.style.left = tx + "px";
  tt.style.top = ty + "px";
}

function showTooltip(idx, x, y) {
  const tt = document.getElementById("tooltip");
  tt.innerHTML = renderTooltip(idx);
  tt.style.display = "block";
  positionTooltip(x, y);
}

function hideTooltip() {
  pinnedIdx = null;
  hoverIdx = null;
  document.getElementById("tooltip").style.display = "none";
}

// Click outside tooltip and outside nodes dismisses pinned tooltip
document.addEventListener("mousedown", function(e) {
  const tt = document.getElementById("tooltip");
  if (pinnedIdx !== null && tt.style.display === "block"
      && !tt.contains(e.target) && !e.target.closest(".node")) {
    hideTooltip();
  }
});

async function render() {
  const { instance } = await import("https://cdn.jsdelivr.net/npm/@viz-js/viz@3.11.0/lib/viz-standalone.mjs");
  const viz = await instance();
  const svg = viz.renderSVGElement(DOT);
  const container = document.getElementById("graph-container");
  container.innerHTML = "";
  container.appendChild(svg);

  // Attach hover listeners and strip native <title> tooltips to avoid double tooltips
  svg.querySelectorAll(".node").forEach(node => {
    const title = node.querySelector("title");
    if (!title) return;
    const idx = parseInt(title.textContent, 10);
    if (isNaN(idx)) return;
    title.remove();  // remove native SVG tooltip
    node.style.cursor = "pointer";
    // Hover: show tooltip following the mouse (non-interactive)
    node.addEventListener("mouseenter", e => {
      if (pinnedIdx !== null) return;  // don't override a pinned tooltip
      hoverIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
    node.addEventListener("mousemove", e => {
      if (pinnedIdx !== null || hoverIdx !== idx) return;
      positionTooltip(e.clientX, e.clientY);
    });
    node.addEventListener("mouseleave", () => {
      if (pinnedIdx !== null) return;
      hoverIdx = null;
      document.getElementById("tooltip").style.display = "none";
    });
    // Click: pin the tooltip so user can scroll it
    node.addEventListener("click", e => {
      e.stopPropagation();
      if (pinnedIdx === idx) { hideTooltip(); return; }
      pinnedIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
  });
  // Also strip <title> from edges and the graph itself
  svg.querySelectorAll(".edge title").forEach(t => t.remove());
  const graphTitle = svg.querySelector(":scope > title");
  if (graphTitle) graphTitle.remove();
}

render().catch(err => {
  document.getElementById("graph-container").innerHTML =
    "<p style='color:red'>Failed to render graph: " + err.message + "</p>" +
    "<pre>" + DOT.replace(/</g,"&lt;") + "</pre>";
});
</script>
</body>
</html>
