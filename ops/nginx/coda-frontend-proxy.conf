# Proxy body for coda-next-frontend.service on 127.0.0.1:8090.
# Installed to /etc/nginx/snippets/coda-frontend-proxy.conf and included from
# every server block that serves the public site — inside a `location /`, which
# is the catch-all, so it must come AFTER the /admin and /api/tts includes.
#
# Requires conf.d/coda-frontend-upgrade-map.conf for $coda_connection_upgrade.
#
# No add_header directives here on purpose, matching the /admin path: one
# source for security headers beats two copies nginx would merge or drop.
proxy_pass http://127.0.0.1:8090;
proxy_http_version 1.1;

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
# $scheme, not a hardcoded https: the app builds Moyasar return URLs and
# Supabase auth callbacks from this, and a wrong value sends a paying customer
# to an origin that does not hold their session.
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $coda_connection_upgrade;

proxy_connect_timeout 10s;
proxy_send_timeout    120s;
# /api/llm and /api/tts wait on a GPU upstream; the default 60s cuts off a
# slow first token.
proxy_read_timeout    120s;

# /api/stt and /api/stt/compare accept audio uploads. The app enforces 25 MB
# and answers with a JSON `audio_too_large`; keep nginx's ceiling just above it
# so callers get that instead of an nginx HTML 413.
client_max_body_size 26m;

# Stream synthesis responses straight through rather than buffering audio.
proxy_buffering off;
proxy_request_buffering off;

# proxy_buffer_size governs the buffer nginx uses to read the response HEADER,
# and it applies even with proxy_buffering off — turning buffering off does not
# make this unnecessary. The default is one page (4-8k), which the app exceeds
# whenever @supabase/ssr refreshes a session: it writes the auth token back as
# several chunked Set-Cookie headers that together run past 8k. nginx then logs
# "upstream sent too big header" and answers 502.
#
# That failure is invisible to anonymous testing — signed-out responses carry
# ~370 bytes of headers — so it only ever hit signed-in users, on the ordinary
# page load. coda-admin-proxy-body.conf has carried these same three values
# from the start; this file was missing them.
proxy_buffer_size 32k;
proxy_buffers 16 16k;
proxy_busy_buffers_size 64k;

proxy_cache_bypass $http_upgrade;
