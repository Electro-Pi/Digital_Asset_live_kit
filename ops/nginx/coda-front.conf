server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name coda.eracoda.com;

    ssl_certificate     /etc/letsencrypt/live/www.coda.eracoda.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.coda.eracoda.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    access_log /var/log/nginx/coda-front.access.log;
    error_log  /var/log/nginx/coda-front.error.log warn;

