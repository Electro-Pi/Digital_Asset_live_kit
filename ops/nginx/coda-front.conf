# ── coda.eracoda.sa / www.coda.eracoda.sa — NOT yet on this host ───────────
# These resolve to 195.35.3.228 (the previous deployment), so nothing below is
# reached today and no certificate exists for them. Kept HTTP-only and ready:
# point the DNS here, run certbot for both names, and it converts these blocks
# the same way it would have on day one.
server {
    listen 80;
    listen [::]:80;
    server_name coda.eracoda.sa;

    server_tokens off;
    access_log /var/log/nginx/coda-front.access.log;
    error_log  /var/log/nginx/coda-front.error.log warn;

    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }

    include /etc/nginx/snippets/coda-tts-api.conf;
    include /etc/nginx/snippets/coda-admin-canonical-redirect.conf;

    location / {
        include /etc/nginx/snippets/coda-frontend-proxy.conf;
    }
}

# Not canonical for anything. A server-level return is correct here precisely
# because nothing is mounted on this name: there is no location that needs to
# be reached first. It lands on coda.eracoda.sa, which handles /admin properly.
server {
    listen 80;
    listen [::]:80;
    server_name www.coda.eracoda.sa;

    server_tokens off;

    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }

    location / {
        return 301 https://coda.eracoda.sa$request_uri;
    }
}
