# The public CODA site and everything mounted on it.
# Installed to /etc/nginx/sites-available/coda-front.conf and symlinked into
# sites-enabled/.
#
#   sudo ln -s /etc/nginx/sites-available/coda-front.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# ── Three origins, one dashboard ────────────────────────────────────────────
# www.coda.eracoda.ai, www.coda.eracoda.com and coda.eracoda.sa are all
# canonical for the public site — they are the three values in the app's
# APP_ORIGINS, and a request that arrives at one is answered by that same one so
# login callbacks and Moyasar return URLs keep their session.
#
# /admin is different: it is canonical on www.coda.eracoda.ai ONLY. The
# dashboard rejects any mutation whose Origin header is not exactly
# ADMIN_ORIGIN, and a session cookie belongs to a single origin, so serving it
# under all three would produce a dashboard that loads and then 403s every
# write. The other names send /admin there with a 308.
#
# ── DNS and certificates, as of 2026-08-23 ─────────────────────────────────
# Live on this host (93.127.163.230), with certificates:
#   www.coda.eracoda.ai, coda.eracoda.ai   -> live/www.coda.eracoda.ai
#   www.coda.eracoda.com, coda.eracoda.com -> live/www.coda.eracoda.com
#
# NOT on this host: coda.eracoda.sa and www.coda.eracoda.sa still resolve to
# 195.35.3.228, the previous deployment. Their blocks are at the bottom, HTTP
# only, and are inert until DNS moves. Do not add TLS to them before then:
# certbot cannot validate a name that resolves elsewhere, and a listen 443
# block referencing a certificate that does not exist stops nginx from starting.
#
# After pointing them here:
#   sudo certbot --nginx -d coda.eracoda.sa -d www.coda.eracoda.sa
#
# Requires:
#   conf.d/coda-frontend-upgrade-map.conf   ($coda_connection_upgrade)
#   conf.d/coda-admin-limits.conf           (admin limit_req zones)
#   conf.d/coda-tts-limit.conf              (gateway limit_req zone)
#   snippets/coda-frontend-proxy.conf       (-> 127.0.0.1:8090)
#   snippets/coda-admin-path.conf           (-> 127.0.0.1:8092)
#   snippets/coda-admin-proxy-body.conf
#   snippets/coda-admin-canonical-redirect.conf
#   snippets/coda-tts-api.conf              (-> 127.0.0.1:8011)

# ── HTTP: renewals, then straight to TLS ───────────────────────────────────
# One block for every name that has a certificate. The ACME location is matched
# with ^~ so the redirect below can never swallow a renewal challenge.
#
# $host, not a fixed name: an apex must land on its own apex over TLS and be
# folded into www there, so that the redirect a client follows is same-origin
# at each step.
server {
    listen 80;
    listen [::]:80;
    server_name www.coda.eracoda.ai coda.eracoda.ai
                www.coda.eracoda.com coda.eracoda.com;

    server_tokens off;

    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── www.coda.eracoda.ai — canonical for the site AND for /admin ─────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.coda.eracoda.ai;

    ssl_certificate     /etc/letsencrypt/live/www.coda.eracoda.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.coda.eracoda.ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    access_log /var/log/nginx/coda-front.access.log;
    error_log  /var/log/nginx/coda-front.error.log warn;

    include /etc/nginx/snippets/coda-tts-api.conf;

    # The one block that serves the dashboard rather than redirecting it.
    # Comment this out before stopping coda-admin-frontend.service, or /admin
    # becomes a public 502.
    include /etc/nginx/snippets/coda-admin-path.conf;

    location / {
        include /etc/nginx/snippets/coda-frontend-proxy.conf;
    }
}

# ── coda.eracoda.ai — apex, folds into www ─────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name coda.eracoda.ai;

    ssl_certificate     /etc/letsencrypt/live/www.coda.eracoda.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.coda.eracoda.ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    access_log /var/log/nginx/coda-front.access.log;
    error_log  /var/log/nginx/coda-front.error.log warn;

    # The apex redirect lives in `location /`, NOT at server level. A
    # server-level `return 301` runs in the SERVER_REWRITE phase, before nginx
    # has chosen a location, so the two includes below would never be reached
    # and every API call would be redirected instead of served. Worse, clients
    # (python-requests included) downgrade POST to GET when following a 301,
    # which would silently turn a synthesis request into a GET of the website.
    #
    # This is the base URL the TTS arena uses, so it is not hypothetical.
    include /etc/nginx/snippets/coda-tts-api.conf;
    include /etc/nginx/snippets/coda-admin-canonical-redirect.conf;

    location / {
        return 301 https://www.coda.eracoda.ai$request_uri;
    }
}

# ── www.coda.eracoda.com — canonical for the site, not for /admin ──────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.coda.eracoda.com;

    ssl_certificate     /etc/letsencrypt/live/www.coda.eracoda.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.coda.eracoda.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    access_log /var/log/nginx/coda-front.access.log;
    error_log  /var/log/nginx/coda-front.error.log warn;

    include /etc/nginx/snippets/coda-tts-api.conf;
    include /etc/nginx/snippets/coda-admin-canonical-redirect.conf;

    location / {
        include /etc/nginx/snippets/coda-frontend-proxy.conf;
    }
}

