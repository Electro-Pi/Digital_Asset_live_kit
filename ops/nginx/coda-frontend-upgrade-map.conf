# Install as /etc/nginx/conf.d/coda-frontend-upgrade-map.conf. `map` is only
# valid in nginx's http context, which is why it cannot live in the snippet.
#
# Carries a WebSocket upgrade through only when the client actually asked for
# one. Sending `Connection: upgrade` on every request (the shortcut) makes an
# ordinary keepalive request look like a failed handshake to some clients.
map $http_upgrade $coda_connection_upgrade {
    default upgrade;
    ''      close;
}
