# Proxy body for coda-admin-frontend.service on 127.0.0.1:8092. Directives only,
# no `location` wrapper, so the four /admin locations can share one copy.
#
# No trailing slash on proxy_pass and no rewrite: the app is built with
# `basePath: "/admin"` and expects to receive that prefix. See
# coda-admin-path.conf.
proxy_pass http://127.0.0.1:8092;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection "upgrade";
proxy_cache_bypass $http_upgrade;
proxy_no_cache 1;
proxy_cache_bypass 1;
proxy_connect_timeout 10s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;
proxy_buffer_size 32k;
proxy_buffers 16 16k;
proxy_busy_buffers_size 64k;
