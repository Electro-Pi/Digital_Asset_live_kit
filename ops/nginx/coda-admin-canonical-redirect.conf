# Sends /admin to the one origin that serves it.
# Installed to /etc/nginx/snippets/coda-admin-canonical-redirect.conf and
# included from the www.coda.eracoda.com and coda.eracoda.sa TLS server blocks
# in sites-available/coda-front.conf, above their frontend include.
#
# The public site is canonical under three names; the dashboard is not. Serving
# it under all three would give each its own cookie jar and would fail the
# app's exact-Origin check on every write. A redirect keeps the other two names
# useful without splitting the session across origins.
#
# 308 rather than 301: a 301 invites clients to downgrade POST to GET, which
# would turn a login attempt into a silent GET of the login page. Nothing
# should be POSTing to these names, but the same mistake has already been made
# on this host once (see coda-tts-api.conf) and it cost two days to notice.
#
# The prefixes mirror coda-admin-path.conf exactly, so /administration and any
# other name that merely starts with "admin" stays with the public site.
location = /admin {
    return 308 https://www.coda.eracoda.ai$request_uri;
}

location ^~ /admin/ {
    return 308 https://www.coda.eracoda.ai$request_uri;
}
