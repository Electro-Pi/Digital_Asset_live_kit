# The admin dashboard, mounted at /admin on the public CODA frontend vhost.
# Installed to /etc/nginx/snippets/coda-admin-path.conf and included from ONLY
# the www.coda.eracoda.ai TLS server block in sites-available/coda-front.conf,
# above its `include .../coda-frontend-proxy.conf`.
#
# Exactly one hostname, on purpose. The app authenticates every mutation by
# comparing the browser's Origin header against ADMIN_ORIGIN, and a session
# cookie belongs to one origin, so serving /admin under www.coda.eracoda.com or
# coda.eracoda.sa as well would produce a dashboard that loads and then rejects
# every write with 403 origin_rejected. Those two names send /admin here
# instead -- see coda-admin-canonical-redirect.conf.
#
# The upstream (coda-admin-frontend.service) is bound to 127.0.0.1:8092 and is
# built with Next's `basePath: "/admin"`, so it expects to receive the prefix.
# proxy_pass therefore carries the URI through unchanged: no trailing slash on
# the upstream, and no rewrite. Stripping /admin here would break every asset
# and API path the app emits, because those are all built with the prefix.
#
# No add_header directives live here. The app sets its own CSP, HSTS,
# X-Frame-Options, X-Robots-Tag and friends in next.config.ts; a second copy
# from nginx would be merged (two CSPs are intersected, tightening the policy
# unpredictably) or ignored (a repeated X-Frame-Options). One source, in the
# app, which also means the headers travel with a rebuild rather than needing an
# nginx reload.
#
# Requires: conf.d/coda-admin-limits.conf (the limit_req zones, which are only
# valid in the http context) and snippets/coda-admin-proxy-body.conf.

# Exact match: `/admin` itself is the dashboard's index. Next serves the mount
# root without a trailing slash, so do not redirect this to `/admin/`.
location = /admin {
    limit_req_status 429;
    client_max_body_size 64k;
    include /etc/nginx/snippets/coda-admin-proxy-body.conf;
}

# The login endpoint gets its own tighter bucket. This is an exact match, so it
# beats every prefix below regardless of length.
location = /admin/api/auth/login {
    limit_req zone=coda_admin_login burst=3 nodelay;
    limit_req_status 429;
    client_max_body_size 64k;
    include /etc/nginx/snippets/coda-admin-proxy-body.conf;
}

# Longer prefix than `^~ /admin/`, so nginx picks this one for the API surface.
location ^~ /admin/api/ {
    limit_req zone=coda_admin_api burst=30 nodelay;
    limit_req_status 429;
    client_max_body_size 64k;
    include /etc/nginx/snippets/coda-admin-proxy-body.conf;
}

# Pages and /admin/_next/* assets. `^~` also stops any future regex location in
# this server block from stealing dashboard traffic.
location ^~ /admin/ {
    limit_req_status 429;
    client_max_body_size 64k;
    include /etc/nginx/snippets/coda-admin-proxy-body.conf;
}
