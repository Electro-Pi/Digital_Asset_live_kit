# Vector store for the medical guideline corpus.
#
# Ports are shifted off Qdrant's 6333/6334 defaults because an unrelated
# project already owns those on this host (same reason the agent runs on 2954).
services:
  qdrant:
    image: qdrant/qdrant:v1.18.1
    container_name: medical-coda-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:${QDRANT_HTTP_PORT:-6335}:6333"
      - "127.0.0.1:${QDRANT_GRPC_PORT:-6336}:6334"
    volumes:
      - medical_qdrant_storage:/qdrant/storage
      - medical_qdrant_snapshots:/qdrant/snapshots
    environment:
      QDRANT__SERVICE__ENABLE_TLS: "false"
      QDRANT__LOG_LEVEL: "INFO"
    healthcheck:
      # The image has no curl/wget, but it does ship bash, which can open a TCP
      # socket via /dev/tcp — enough to prove the HTTP port is accepting.
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  medical_qdrant_storage:
  medical_qdrant_snapshots:
